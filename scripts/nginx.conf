events {}
http {
    upstream limiter {
        server node1:8080;
        server node2:8080;
        server node3:8080;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://limiter;
            proxy_set_header X-Client-Id $http_x_client_id;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
