# ---------------------------------------------------------------------------------------------
# Distributed rate limiter - service configuration
# Every key can be overridden by env var RL_<KEY_UPPERCASED_WITH_UNDERSCORES>,
# e.g. RL_MODE=REDIS, RL_RULE_API_LIMIT=500. REDIS_HOST / REDIS_PORT / REDIS_PASSWORD also work.
# ---------------------------------------------------------------------------------------------

server.port=8080

# LOCAL = in-process only (single node). REDIS = shared limits across all nodes.
mode=LOCAL

redis.host=localhost
redis.port=6379
redis.pool.size=64
redis.connect.timeout.ms=200
redis.read.timeout.ms=100
redis.borrow.timeout.ms=50

# When Redis is down: FAIL_OPEN | FAIL_CLOSED | LOCAL_FALLBACK
failure.mode=LOCAL_FALLBACK
# LOCAL_FALLBACK divides each limit by this so N nodes together stay near the global limit.
failure.expected.nodes=3
# Circuit breaker: open after N consecutive Redis errors, probe again after open.ms
breaker.failure.threshold=5
breaker.open.ms=2000

# ---- Rules ----------------------------------------------------------------------------------
# General API traffic: bursts of 100, sustained 50 req/s per client.
rule.api.algorithm=TOKEN_BUCKET
rule.api.limit=100
rule.api.refill.per.second=50

# Login attempts: exactly 5 per minute per account. Exactness matters, volume is tiny.
rule.login.algorithm=SLIDING_WINDOW_LOG
rule.login.limit=5
rule.login.window.ms=60000

# Search: 1000 per minute per tenant. High volume, O(1) memory, ~approximate is fine.
rule.search.algorithm=SLIDING_WINDOW_COUNTER
rule.search.limit=1000
rule.search.window.ms=60000

# Used by the /demo/hello endpoint (keyed by X-Client-Id header).
rule.demo.algorithm=TOKEN_BUCKET
rule.demo.limit=5
rule.demo.refill.per.second=1
